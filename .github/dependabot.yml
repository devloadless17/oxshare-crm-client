# Dependency scanning — PLATFORM-CONVENTIONS R-7.6.
#
# TWIN FILE — an identical copy lives at the same path in oxshare-crm-admin,
# differing only in the note below and the app-specific groups.
#
# There was none, in any repo, and CI installs with `--no-audit`. This app takes
# KYC document uploads, holds client session cookies and renders wallet
# balances; a compromised transitive dependency here reads all three.
version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ['dependencies']
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ['minor', 'patch']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      radix:
        patterns: ['@radix-ui/*']
        update-types: ['minor', 'patch']

    # decimal.js is pinned exactly (ARCHITECTURE §2) and is deliberately in no
    # group, so a bump to the library behind lib/money.ts — which formats every
    # balance this app shows — arrives as its own reviewable PR.
    ignore: []

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    labels: ['dependencies']
