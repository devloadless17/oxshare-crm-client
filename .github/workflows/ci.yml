name: CI

# ── Minutes are a budget, so this runs when it can tell you something ────────
#
# Private-repo Actions minutes are finite and this suite is not cheap, so the
# triggers below are shaped to skip runs that could not fail:
#
#  - `paths-ignore` — a markdown-only commit cannot break a type-check. A docs
#    change once cost a full run for nothing, which is what prompted this.
#  - `pull_request` is scoped to PRs targeting `production`. Every push to `main`
#    already runs this workflow, so an unscoped trigger re-ran the SAME commits a
#    second time for the merge PR — paying twice for one answer.
#  - `workflow_dispatch` so a skipped or filtered commit can still be checked on
#    demand, without an empty commit to provoke it.
#
# To skip a run deliberately, put `[skip ci]` in the commit message — GitHub
# honours it natively. Ten exploratory pushes cost nothing; drop the tag on the
# one that matters. `workflow_dispatch` still works on a skipped commit.
#
# ── A push to `production` deploys (DEPLOY-PLAYBOOK §1) ──────────────────────
#
#   main / PRs to production → verify only, never touches a server
#   push to production       → verify → build (Docker Hub, :latest + :<sha>)
#                              → deploy THIS app only to the frontends server
#                                (`ssh oxshare-web`), health-gated
#
# The other frontend on that server is never touched by this repo's deploy.
on:
  push:
    branches: [main, production]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.vscode/**'
  pull_request:
    branches: [production]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.vscode/**'
  workflow_dispatch:

# A superseded run tells you about a commit nobody is on any more. Cancelling it
# frees the minutes for the run that replaced it. `production` is exempt:
# cancelling a deploy mid-ssh orphans containers on the server (DEPLOY-PLAYBOOK §1).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/production' }}

jobs:
  verify:
    name: Type-check, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # PLATFORM-CONVENTIONS R-7.6. `--no-audit` above keeps the install quiet;
      # auditing is a separate, FAILING step rather than install noise nobody
      # reads. This app takes KYC uploads and holds client session cookies.
      #
      # `--omit=dev`, as the backend does: this audits what SHIPS. A dev-only
      # advisory must not block a production deploy (5 Oct 2026: `braces` via
      # eslint-config-next, with no patched release yet, failed every run while
      # the production tree was clean). Dev tooling never reaches the image.
      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev

      - name: Type-check
        run: npm run type-check

      # Formatting is a gate, not a preference: the two frontends keep several
      # deliberately identical "twin" files, and unformatted code makes a real
      # behavioural diff between them impossible to spot.
      - name: Format check
        run: npm run format:check

      # No continue-on-error: a lint gate that cannot fail is not a gate.
      - name: Lint
        run: npm run lint

      # --coverage so the thresholds in vitest.config.mts actually bind. They are
      # floors pinned to measured numbers, not aspirations, and may only go up.
      - name: Unit tests
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          # src/lib/env.ts resolves this AT IMPORT and throws in production so a
          # misconfigured build fails immediately rather than on the unlucky
          # first request. That is deliberate — but it also means a build with
          # no value cannot succeed at all, and CI never supplied one, so this
          # step failed on every push regardless of the change.
          #
          # A deployment supplies its own real URL. This value exists only to
          # satisfy the guard while compiling, and is never served.
          NEXT_PUBLIC_API_BASE_URL: https://ci-build-placeholder.invalid

      # PLATFORM-CONVENTIONS R-1.5. Runs AFTER the build, because it reads that
      # build's CSS output.
      #
      # Tailwind emits only the utilities it finds in the source and globals.css
      # supplies the rest, so the compiled bundle is the complete set of classes
      # that resolve — one used in source but absent from it resolves to nothing.
      # Classes styled by a same-file `<style jsx>` block are exempt: styled-jsx
      # compiles into the JS bundle and those DO work, as long as the component
      # rendering the markup is the one holding the block.
      #
      # That distinction is the bug this exists for. In the admin app a scoped
      # block kept styling a page after its markup moved into child components,
      # so the classes silently stopped matching and the KYC review screen
      # rendered "CountryUAE" run together. Nothing else could see it: a
      # className is a string, an unmatched CSS rule is not an error, and
      # component tests assert on text and roles rather than layout.
      - name: CSS classes resolve
        run: npm run check:css

      # PLATFORM-CONVENTIONS R-1.3 — the real drift guard.
      #
      # This step existed and had never once run. The script exited 0 when the
      # backend was not checked out beside this repo, and nothing here ever
      # checked it out, so every push printed "skipping" and passed while the
      # rule index recorded contract drift as guarded. The comment also pointed
      # at a "nightly cross-repo job" — no scheduled workflow exists in any of
      # the three repos.
      #
      # The cost was concrete: POST /payments/withdrawals declares
      # Idempotency-Key required, the portal did not send it, and every client
      # withdrawal answered 400. Comparing the caller against the contract is
      # what turns that into a red build rather than a support ticket.
      #
      # So the contract is fetched here, and the script now FAILS rather than
      # skips when it is absent. Both halves are needed: either one alone brings
      # the silent pass back.
      - name: Fetch the backend contract
        uses: actions/checkout@v4
        with:
          repository: devloadless17/oxshare-crm-backend
          # Same owner, so the default token works while the repo is visible to
          # it. If that stops being true the step FAILS the build rather than
          # degrading to a skip — which is the behaviour this whole change is
          # about. Set CROSS_REPO_TOKEN to a read-only PAT if needed.
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          path: .contract
          sparse-checkout: openapi.json
          sparse-checkout-cone-mode: false

      - name: API types match the backend contract
        env:
          OXSHARE_CONTRACT: ${{ github.workspace }}/.contract/openapi.json
        run: ./scripts/check-api-types.sh

  # ── The client journeys, as EVIDENCE ──────────────────────────────────────
  #
  # These specs ARE the product: register, verify, sign in, KYC, upload. Until
  # now nothing ran them automatically, and — more quietly — nothing could tell
  # a run that exercised them from one that did not.
  #
  # A skipped Playwright test reports as PASSING. This suite guards against
  # conditions that are ordinary on a shared machine (registration is capped at
  # 10/hour per address, login and forgot-password are capped too, a fixture may
  # be absent), and skipping is right on a laptop — a red suite for a rate limit
  # teaches people to ignore red. But it means a green summary can prove nothing
  # happened. `requirePrecondition` + `E2E_STRICT=1` is the switch.
  #
  # The VIEWPORT and TOPOLOGY guards are deliberately NOT routed through it.
  # `test.skip(isMobile, …)` and `test.skip(!CROSS, …)` say the case does not
  # apply to the project being run; failing those would make the suite
  # permanently red for something that is not a defect, which is the same
  # ignore-the-red-build failure by the opposite route.
  #
  # Triggers match the rest of this file: production PRs and on demand, never on
  # every push. Standing up Postgres, Redis, the API and a browser costs minutes
  # this repo budgets, and a production PR is the deploy gate — the moment
  # evidence is actually worth paying for.
  journeys:
    name: Client journeys (E2E_STRICT)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oxshare
          POSTGRES_PASSWORD: oxshare_ci
          POSTGRES_DB: oxshare
        ports: ['5432:5432']
        # Without the health gate the API races the database's first accept()
        # and dies on boot, which reads as a failed test rather than as a
        # container that was not ready.
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
      # Mail is part of these journeys, not a detail beside them: registration,
      # verification, invitation and password reset all continue through a
      # link that only exists in an inbox. Without this the specs that use one
      # fail on `waitForMail` — which reads as a broken app and is a missing
      # container.
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
        options: >-
          --health-cmd "wget -q -O- http://localhost:8025/readyz || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The API is a sibling repo and this job cannot run without it. Same rule
      # as the contract step: if it cannot be fetched the build FAILS rather
      # than degrading into a skip.
      - name: Check out the backend
        uses: actions/checkout@v4
        with:
          repository: devloadless17/oxshare-crm-backend
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          path: .api

      # ONE step, so the API's environment is written once.
      #
      # GitHub Actions does not support YAML anchors, and a job-level `env`
      # cannot be used either: `PORT` would reach the portal's dev server, which
      # reads it — Next would try to start on the API's port and every journey
      # would fail with a collision that looks like a broken app.
      - name: Start the API
        working-directory: .api
        # Seeds run on boot outside production and are idempotent, which is what
        # puts the e2e fixtures in the database. Without them E2E_STRICT turns
        # the journeys that need one into failures — correctly, but the cause
        # would be this step rather than the app.
        run: |
          # The API's lockfile needs npm 11, and this step installs the API's
          # dependencies — so it owes the same pin the backend's own CI carries.
          # npm 10 mishandles a lockfile whose package.json has `overrides`: it
          # re-resolves nested ranges against the registry's latest instead of
          # the locked version, so a release by any transitive dep starts
          # refusing the committed lockfile with "Missing: <pkg> from lock
          # file" and no commit involved. esbuild 0.28.2 is what tripped it
          # here, turning both frontends' E2E red at once with a message about
          # the API failing to start.
          npm install -g npm@11
          npm ci --no-audit --no-fund
          npm run build
          npm run db:migrate
          node dist/main &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/health >/dev/null 2>&1; then
              echo "API up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy in 60s"; exit 1
        env:
          DATABASE_URL: postgresql://oxshare:oxshare_ci@localhost:5432/oxshare
          REDIS_URL: redis://localhost:6379
          NODE_ENV: development
          PORT: '3001'
          API_PUBLIC_URL: http://localhost:3001
          # The portal's dev server is 3000 in the localhost topology; the admin
          # is not started here at all, and the API only needs a valid origin.
          PORTAL_URL: http://localhost:3000
          # E2E ONLY — the counter goes permissive, the guard stays wired.
          # `env.validation.ts` refuses to boot with this in production, because
          # these limits ARE the §8.4 control on credential stuffing. It exists
          # because the browser suites met the real caps and WAITED them out:
          # ~5.4 minutes of sleeping in a 20-minute job, and the largest class of
          # flakes this project has — a rate limit reported variously as a
          # rejected password, a broken invite, a navigation timeout and a
          # missing screen. The limits stay covered by three backend suites.
          RELAX_RATE_LIMITS: '1'
          ADMIN_URL: http://localhost:3002
          # Ephemeral and CI-only. Real deployments supply their own; these
          # exist to satisfy the boot-time validation, which refuses to start on
          # a bad config rather than failing later on the unlucky request.
          ADMIN_JWT_SECRET: ci-admin-secret-ci-admin-secret-32
          ADMIN_JWT_REFRESH_SECRET: ci-admin-refresh-ci-admin-refresh
          JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secre
          APP_ENCRYPTION_KEY: ci-encryption-key-ci-encryption-k
          RIVAL_WEBHOOK_KEY: ci-rival-webhook-key
          # `disk`, STATED. env.validation refuses to infer a driver, and a run
          # that billed a live R2 account per push is one somebody disables.
          STORAGE_DRIVER: disk
          # No proxy in front of the API here, so the socket address IS the
          # caller — see the backend's common/security/client-ip.ts.
          TRUSTED_PROXY_HOPS: '0'
          # The commission engine holds rather than pay an aged backlog nobody
          # decided about. A fresh CI database has no history, so this only ever
          # applies to the seeds — and saying so beats the engine holding while
          # the journeys blame the screen.
          IB_ACCRUAL_START: all

      # SMTP is ADMIN-CONFIGURED, in the database — `env.validation.ts` says
      # "THERE ARE NO SMTP_* VARIABLES AT ALL", deliberately, so that a deploy
      # missing mail cannot start up quietly and swallow every message. The
      # consequence for CI is that a Mailpit container alone sends nothing:
      # somebody has to save the settings, exactly as an operator would on
      # Settings → Email. This is that, over the same endpoint.
      - name: Point SMTP at Mailpit
        run: |
          JAR=$(mktemp)
          curl -fsS -c "$JAR" -o /dev/null -X POST http://localhost:3001/v1/admin/auth/login \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:3002' \
            -d '{"email":"admin@oxshare.com","password":"admin123"}'
          # The anti-forgery token is a cookie here (same host), so it is read
          # from the jar rather than the echo header the browser path uses.
          CSRF=$(awk '$6 ~ /csrf/ {print $7}' "$JAR" | tail -1)
          test -n "$CSRF" || { echo "no CSRF cookie after admin login"; exit 1; }
          curl -fsS -b "$JAR" -o /dev/null -X PUT http://localhost:3001/v1/admin/settings/smtp \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:3002' \
            -H "X-OxShare-CSRF: $CSRF" \
            -d '{"host":"localhost","port":1025,"username":null,"password":null,"fromAddress":"\"OxShare CI\" <no-reply@oxshare.test>","secure":false}'
          echo "SMTP points at Mailpit."

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the journeys
        run: npm run e2e
        env:
          # THE POINT OF THIS JOB. A precondition that cannot be met now FAILS
          # and names itself, instead of skipping and reporting as passed.
          E2E_STRICT: '1'
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001

      # Traces and screenshots are kept only for failures, so this stays small
      # and is the difference between a diagnosable red build and reproducing it.
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # Everything below runs ONLY for a push to `production`. On a pull_request,
  # github.ref is refs/pull/N/merge, so the event is checked too.
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build and push image
    if: github.ref == 'refs/heads/production' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # NEXT_PUBLIC_* are BAKED INTO the image (bundle and CSP), so a wrong value
      # here ships a client portal that calls the wrong API until the next release.
      # Checked here, where the message can name the secret.
      - name: Check the API origin
        env:
          API_ORIGIN: ${{ secrets.API_ORIGIN }}
        run: |
          set -euo pipefail
          case "$API_ORIGIN" in
            "") echo "::error::Missing GitHub secret API_ORIGIN (e.g. https://api.example.com)."; exit 1 ;;
            https://*/*) echo "::error::API_ORIGIN must be an origin only: no path, no trailing slash (it is '$API_ORIGIN')."; exit 1 ;;
            https://*) echo "API origin: $API_ORIGIN" ;;
            *) echo "::error::API_ORIGIN must start with https:// (it is '$API_ORIGIN')."; exit 1 ;;
          esac

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}

      # A push does not check visibility, and a push to a repository that does not
      # exist CREATES it with the account's default visibility, usually public. The
      # backend's image was found public on 5 Oct 2026; this refuses both cases.
      - name: Refuse a public or missing Docker Hub repository
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_SECRET: ${{ secrets.DOCKER_SECRET }}
          REPOSITORY: oxshare-crm-portal
        run: |
          set -euo pipefail
          repo="$DOCKER_USERNAME/$REPOSITORY"
          body() { jq -n --arg a "$1" --arg b "$2" --arg ka "$3" --arg kb "$4" '{($ka): $a, ($kb): $b}'; }
          jwt=$(curl -sS -H 'Content-Type: application/json' \
                  -d "$(body "$DOCKER_USERNAME" "$DOCKER_SECRET" identifier secret)" \
                  https://hub.docker.com/v2/auth/token | jq -r '.access_token // empty' || true)
          [ -n "$jwt" ] || jwt=$(curl -sS -H 'Content-Type: application/json' \
                  -d "$(body "$DOCKER_USERNAME" "$DOCKER_SECRET" username password)" \
                  https://hub.docker.com/v2/users/login | jq -r '.token // empty' || true)
          [ -n "$jwt" ] || { echo "::error::Could not sign in to Docker Hub's API to check that $repo is private."; exit 1; }
          private=$(curl -sS -H "Authorization: Bearer $jwt" "https://hub.docker.com/v2/repositories/$repo/" | jq -r '.is_private // "missing"')
          case "$private" in
            true)  echo "$repo is private." ;;
            false) echo "::error::$repo is PUBLIC on Docker Hub. Make it private (Repository → Settings → Visibility), then re-run."; exit 1 ;;
            *)     echo "::error::$repo does not exist on Docker Hub. Create it as PRIVATE first: a push would create it with the account's default visibility."; exit 1 ;;
          esac

      # `latest` for a human, the commit SHA for the machine: the deploy pins the
      # SHA, so `up -d` always recreates, and the tag is the rollback target.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.API_ORIGIN }}
            NEXT_PUBLIC_REALTIME_ORIGIN=${{ secrets.API_ORIGIN }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/oxshare-crm-portal:latest
            ${{ secrets.DOCKER_USERNAME }}/oxshare-crm-portal:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy the client portal (only)
    if: github.ref == 'refs/heads/production' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # On the frontends server, relative to VPS_USER's home: ONE directory and
      # ONE compose project for both frontends, behind one Caddy.
      DEPLOY_DIR: oxshare-web
      SERVICE: portal
    steps:
      - name: Validate secrets
        env:
          REQUIRED: |
            DOCKER_USERNAME DOCKER_SECRET VPS_HOST VPS_USER VPS_SSH_KEY_B64
            ADMIN_DOMAIN PORTAL_DOMAIN ACME_EMAIL
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          get() { printf '%s' "$SECRETS_JSON" | jq -r --arg k "$1" '.[$k] // ""'; }
          missing=""
          for key in $REQUIRED; do [ -z "$(get "$key")" ] && missing="$missing $key"; done
          [ -z "$missing" ] || { echo "::error::Missing required GitHub secret(s):$missing"; exit 1; }
          # Bare hostnames: Caddy takes them as site addresses, and a scheme or a
          # path would make it serve the wrong site or none.
          for key in ADMIN_DOMAIN PORTAL_DOMAIN; do
            case "$(get "$key")" in
              *://*|*/*|*" "*|*"'"*) echo "::error::$key must be a bare hostname like admin.example.com."; exit 1 ;;
            esac
          done
          echo "All required secrets present and well-formed."

      - uses: actions/checkout@v4

      # Base64 as a single line so the key's newlines cannot be mangled on paste.
      - name: Prepare SSH key
        env:
          KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          head -1 ~/.ssh/deploy_key | grep -q "PRIVATE KEY" \
            || { echo "::error::VPS_SSH_KEY_B64 did not decode to a private key"; exit 1; }

      # Hostinger's edge DDoS scrubbing intermittently drops shared-runner IPs,
      # which looks identical to sshd being down. Poll; a re-run draws a new IP.
      - name: Wait for the server to accept connections
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          for i in $(seq 1 7); do
            if timeout 8 bash -c "exec 3<>/dev/tcp/$HOST/$PORT" 2>/dev/null; then
              echo "$HOST:$PORT reachable (attempt $i/7)"; exit 0
            fi
            echo "$HOST:$PORT unreachable (attempt $i/7); retrying in 8s"; sleep 8
          done
          echo "::error::$HOST:$PORT never became reachable. Re-run for a fresh runner IP."
          exit 1

      - name: Ship and deploy
        env:
          HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_SECRET: ${{ secrets.DOCKER_SECRET }}
          ADMIN_DOMAIN: ${{ secrets.ADMIN_DOMAIN }}
          PORTAL_DOMAIN: ${{ secrets.PORTAL_DOMAIN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
        run: |
          set -euo pipefail
          KEY=~/.ssh/deploy_key
          COMMON="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          ssh -i "$KEY" -p "$PORT" $COMMON "$SSH_USER@$HOST" "mkdir -p $DEPLOY_DIR"
          # The shared stack (a TWIN of the other frontend repo's deploy/).
          scp -i "$KEY" -P "$PORT" $COMMON deploy/docker-compose.yml deploy/Caddyfile deploy/release.sh \
            "$SSH_USER@$HOST:$DEPLOY_DIR/"

          REMOTE_SCRIPT="$(cat <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_DIR"
          touch .env && chmod 600 .env

          # The domains, ONE line at a time: .env is shared with the other app's
          # deploys. Single-quoted, because compose expands $VAR in unquoted
          # values (DEPLOY-PLAYBOOK §8). Images are NOT here: release.sh keeps
          # each app's colours in release.env.
          setkv() {
            { grep -v "^$1=" .env || true; printf "%s='%s'\n" "$1" "$2"; } > .env.next
            mv -f .env.next .env && chmod 600 .env
          }
          setkv ADMIN_DOMAIN "$ADMIN_DOMAIN"
          setkv PORTAL_DOMAIN "$PORTAL_DOMAIN"
          setkv ACME_EMAIL "$ACME_EMAIL"

          echo "$DOCKER_SECRET" | docker login -u "$DOCKER_USERNAME" --password-stdin
          # Zero downtime: the new version starts BESIDE the live one, Caddy
          # switches once it is healthy, the old one drains. A release that never
          # becomes healthy is stopped and the live version carries on.
          # Rollback: `bash release.sh rollback <app>` on the server.
          bash release.sh deploy "$SERVICE" "$IMAGE"
          docker logout >/dev/null 2>&1 || true
          bash release.sh status
          REMOTE
          )"

          # Everything goes over STDIN with %q quoting, never the ssh argv, which
          # is world-readable through `ps` on the server while the deploy runs.
          {
            printf 'DEPLOY_DIR=%q\n' "$DEPLOY_DIR"
            printf 'SERVICE=%q\n' "$SERVICE"
            printf 'IMAGE=%q\n' "$DOCKER_USERNAME/oxshare-crm-portal:$GITHUB_SHA"
            printf 'DOCKER_USERNAME=%q\n' "$DOCKER_USERNAME"
            printf 'DOCKER_SECRET=%q\n' "$DOCKER_SECRET"
            printf 'ADMIN_DOMAIN=%q\n' "$ADMIN_DOMAIN"
            printf 'PORTAL_DOMAIN=%q\n' "$PORTAL_DOMAIN"
            printf 'ACME_EMAIL=%q\n' "$ACME_EMAIL"
            printf '%s\n' "$REMOTE_SCRIPT"
          } | ssh -i "$KEY" -p "$PORT" $COMMON "$SSH_USER@$HOST" "bash -s"
