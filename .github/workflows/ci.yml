name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Type-check, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # PLATFORM-CONVENTIONS R-7.6. `--no-audit` above keeps the install quiet;
      # auditing is a separate, FAILING step rather than install noise nobody
      # reads. This app takes KYC uploads and holds client session cookies.
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run type-check

      # Formatting is a gate, not a preference: the two frontends keep several
      # deliberately identical "twin" files, and unformatted code makes a real
      # behavioural diff between them impossible to spot.
      - name: Format check
        run: npm run format:check

      # No continue-on-error: a lint gate that cannot fail is not a gate.
      - name: Lint
        run: npm run lint

      # --coverage so the thresholds in vitest.config.mts actually bind. They are
      # floors pinned to measured numbers, not aspirations, and may only go up.
      - name: Unit tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # PLATFORM-CONVENTIONS R-1.3 — the real drift guard.
      #
      # A comment here used to claim the build step caught backend drift. It
      # could not: this job never runs the backend, so it type-checks against the
      # committed types.gen.ts, and a backend shape change with no regeneration
      # left this pipeline green while the running system was broken.
      #
      # Now the backend commits openapi.json, and this regenerates from it and
      # diffs. Skipped rather than failed when the sibling repo is not checked
      # out, because CI must never depend on a sibling checkout existing — it
      # runs for real in the nightly cross-repo job and locally before a push.
      - name: API types match the backend contract
        run: ./scripts/check-api-types.sh
