name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Type-check, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # PLATFORM-CONVENTIONS R-7.6. `--no-audit` above keeps the install quiet;
      # auditing is a separate, FAILING step rather than install noise nobody
      # reads. This app takes KYC uploads and holds client session cookies.
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run type-check

      # Formatting is a gate, not a preference: the two frontends keep several
      # deliberately identical "twin" files, and unformatted code makes a real
      # behavioural diff between them impossible to spot.
      - name: Format check
        run: npm run format:check

      # No continue-on-error: a lint gate that cannot fail is not a gate.
      - name: Lint
        run: npm run lint

      # --coverage so the thresholds in vitest.config.mts actually bind. They are
      # floors pinned to measured numbers, not aspirations, and may only go up.
      - name: Unit tests
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          # src/lib/env.ts resolves this AT IMPORT and throws in production so a
          # misconfigured build fails immediately rather than on the unlucky
          # first request. That is deliberate — but it also means a build with
          # no value cannot succeed at all, and CI never supplied one, so this
          # step failed on every push regardless of the change.
          #
          # A deployment supplies its own real URL. This value exists only to
          # satisfy the guard while compiling, and is never served.
          NEXT_PUBLIC_API_BASE_URL: https://ci-build-placeholder.invalid

      # PLATFORM-CONVENTIONS R-1.5. Runs AFTER the build, because it reads that
      # build's CSS output.
      #
      # Tailwind emits only the utilities it finds in the source and globals.css
      # supplies the rest, so the compiled bundle is the complete set of classes
      # that resolve — one used in source but absent from it resolves to nothing.
      # Classes styled by a same-file `<style jsx>` block are exempt: styled-jsx
      # compiles into the JS bundle and those DO work, as long as the component
      # rendering the markup is the one holding the block.
      #
      # That distinction is the bug this exists for. In the admin app a scoped
      # block kept styling a page after its markup moved into child components,
      # so the classes silently stopped matching and the KYC review screen
      # rendered "CountryUAE" run together. Nothing else could see it: a
      # className is a string, an unmatched CSS rule is not an error, and
      # component tests assert on text and roles rather than layout.
      - name: CSS classes resolve
        run: npm run check:css

      # PLATFORM-CONVENTIONS R-1.3 — the real drift guard.
      #
      # This step existed and had never once run. The script exited 0 when the
      # backend was not checked out beside this repo, and nothing here ever
      # checked it out, so every push printed "skipping" and passed while the
      # rule index recorded contract drift as guarded. The comment also pointed
      # at a "nightly cross-repo job" — no scheduled workflow exists in any of
      # the three repos.
      #
      # The cost was concrete: POST /payments/withdrawals declares
      # Idempotency-Key required, the portal did not send it, and every client
      # withdrawal answered 400. Comparing the caller against the contract is
      # what turns that into a red build rather than a support ticket.
      #
      # So the contract is fetched here, and the script now FAILS rather than
      # skips when it is absent. Both halves are needed: either one alone brings
      # the silent pass back.
      - name: Fetch the backend contract
        uses: actions/checkout@v4
        with:
          repository: devloadless17/oxshare-crm-backend
          # Same owner, so the default token works while the repo is visible to
          # it. If that stops being true the step FAILS the build rather than
          # degrading to a skip — which is the behaviour this whole change is
          # about. Set CROSS_REPO_TOKEN to a read-only PAT if needed.
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          path: .contract
          sparse-checkout: openapi.json
          sparse-checkout-cone-mode: false

      - name: API types match the backend contract
        env:
          OXSHARE_CONTRACT: ${{ github.workspace }}/.contract/openapi.json
        run: ./scripts/check-api-types.sh
